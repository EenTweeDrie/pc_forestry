[project]
name = "pc-forestry"
version = "0.4.5"
description = ""
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "EenTweeDrie", email = "eentweedrie@yandex.ru" }]
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "numpy>=1.24,<3.0",
    "open3d==0.19.0",
    "pyvista==0.45.2",
    "urllib3<2.0",
    "lzf==0.1",
    "h5py==3.13.0",
    "hdbscan==0.8.40",
    "circle-fit==0.2.1",
    "loguru==0.7.3",
    "laspy[laszip,lazrs]==2.5.4",
    "catboost==1.2.8",
    "imageio==2.37.0",
    "lightgbm==4.6.0",
    "xgboost==3.0.2",
    "pytorch-tabnet==4.1.0",
    "numba==0.61.2",
    "shapely>=2.1.2,<3.0.0",
    "pyshp>=2.3.1,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "scikit-image>=0.25.2,<1.0.0",
    "connected-components-3d>=3.25.0,<4.0.0",
    "openpyxl>=3.1.5,<4.0.0",
]

[tool.uv]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pc_forestry"]
