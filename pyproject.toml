[tool.poetry]
name = "pc-forestry"
version = "0.4.4"
description = ""
authors = ["EenTweeDrie <eentweedrie@yandex.ru>"]
license = "MIT"
readme = "README.md"
packages = [{include = "pc_forestry"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = { version = "*", source = "pytorch" }
torchvision = { version = "*", source = "pytorch" }
torchaudio = { version = "*", source = "pytorch" }
numpy = "2.2.5"
open3d = "0.19.0"
pyvista = "0.45.2"
urllib3 = "<2.0"
lzf = "0.1"
h5py = "3.13.0"
hdbscan = "0.8.40"
circle-fit = "0.2.1"
loguru = "0.7.3"
laspy = {extras = ["laszip", "lazrs"], version = "2.5.4"}
catboost = "1.2.8"
imageio = "2.37.0"
lightgbm = "4.6.0"
xgboost = "3.0.2"
pytorch-tabnet = "4.1.0"
numba = "0.61.2"
shapely = "^2.1.2"
pyshp = "^2.3.1"
scipy = "^1.11.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

